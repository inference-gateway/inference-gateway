---
version: '3'

vars:
  GATEWAY_API_VERSION: v1.5.1
  ENVOY_GATEWAY_VERSION: v1.2.0
  CERT_MANAGER_VERSION: v1.20.2
  PROMETHEUS_STACK_VERSION: 72.6.2
  GRAFANA_OPERATOR_VERSION: 5.18.0
  POSTGRES_VERSION: 16.6.2
  KEYCLOAK_VERSION: 26.2.4
  AUTH_EXAMPLE: ../examples/kubernetes/authentication

tasks:
  deploy-infrastructure:
    desc: 'Deploy the infrastructure'
    cmds:
      - task: create-cluster
      - task: deploy-gateway-api
      - task: deploy-cert-manager
      - task: deploy-envoy-gateway
      - task: deploy-monitoring-stack
      - task: deploy-postgres
      - task: deploy-keycloak
      - task: configure-coredns
      - echo "🚀 Infrastructure deployed successfully!"

  create-cluster:
    desc: 'Create a Kubernetes cluster using ctlptl'
    cmds:
      - ctlptl apply -f Cluster.yaml
      - echo "🛠️ Cluster created successfully!"

  deploy-gateway-api:
    desc: 'Install the Kubernetes Gateway API CRDs (before cert-manager so it watches Gateways)'
    cmds:
      - kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{.GATEWAY_API_VERSION}}/standard-install.yaml
      - echo "🌐 Gateway API CRDs installed successfully!"

  deploy-cert-manager:
    desc: 'Deploy cert-manager and the self-signed ClusterIssuer'
    cmds:
      - helm repo add jetstack https://charts.jetstack.io
      - helm repo update
      - |
        helm upgrade --install cert-manager jetstack/cert-manager \
          --create-namespace \
          --namespace cert-manager \
          --version {{.CERT_MANAGER_VERSION}} \
          --set crds.enabled=true \
          --wait
      - kubectl apply -f {{.AUTH_EXAMPLE}}/cert-manager/
      - echo "🔐 Cert-manager deployed successfully!"

  deploy-envoy-gateway:
    desc: 'Deploy Envoy Gateway and register the envoy GatewayClass'
    cmds:
      - |
        helm upgrade --install envoy-gateway \
          oci://docker.io/envoyproxy/gateway-helm \
          --version {{.ENVOY_GATEWAY_VERSION}} \
          --namespace envoy-gateway-system \
          --create-namespace \
          --skip-crds \
          --wait
      - kubectl -n envoy-gateway-system wait --for=condition=Available --timeout=120s deployment/envoy-gateway
      - |
        kubectl apply -f - <<'EOF'
        apiVersion: gateway.networking.k8s.io/v1
        kind: GatewayClass
        metadata:
          name: envoy
        spec:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        EOF
      - echo "🚪 Envoy Gateway deployed successfully!"

  deploy-monitoring-stack:
    desc: 'Deploy the Prometheus and Grafana operators'
    cmds:
      - helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
      - helm repo add grafana https://grafana.github.io/helm-charts
      - helm repo update
      - |
        helm upgrade --install \
          --create-namespace \
          --namespace observability \
          --version {{.PROMETHEUS_STACK_VERSION}} \
          --set prometheus.prometheusSpec.serviceMonitorSelectorNilUsesHelmValues=false \
          --set prometheus.prometheusSpec.podMonitorSelectorNilUsesHelmValues=false \
          --set-string prometheus.prometheusSpec.serviceMonitorNamespaceSelector.matchLabels.monitoring=true \
          --set prometheus.enabled=false \
          --set alertmanager.enabled=false \
          --set kubeStateMetrics.enabled=false \
          --set nodeExporter.enabled=false \
          --set grafana.enabled=false \
          --wait \
          kube-prometheus-stack prometheus-community/kube-prometheus-stack
      - |
        helm upgrade --install \
          --create-namespace \
          --namespace observability \
          --version {{.GRAFANA_OPERATOR_VERSION}} \
          --wait \
          grafana-operator grafana/grafana-operator
      - echo "📈 Monitoring stack deployed successfully!"

  deploy-postgres:
    desc: 'Deploy the PostgreSQL database for Keycloak'
    cmds:
      - helm repo add bitnami https://charts.bitnami.com/bitnami
      - helm repo update
      - |
        helm upgrade --install keycloak-db bitnami/postgresql \
          --create-namespace \
          --namespace idp \
          --version {{.POSTGRES_VERSION}} \
          --set global.postgresql.auth.username=dbusername \
          --set global.postgresql.auth.password=dbpassword \
          --set global.postgresql.auth.database=keycloak \
          --set primary.resources.requests.cpu=100m \
          --set primary.resources.requests.memory=256Mi \
          --set primary.resources.limits.cpu=500m \
          --set primary.resources.limits.memory=512Mi \
          --wait
      - echo "🐘 PostgreSQL deployed successfully!"

  deploy-keycloak:
    desc: 'Deploy the Keycloak operator, a Keycloak instance and the inference-gateway realm'
    cmds:
      - kubectl -n idp apply -f https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/{{.KEYCLOAK_VERSION}}/kubernetes/keycloaks.k8s.keycloak.org-v1.yml
      - kubectl -n idp apply -f https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/{{.KEYCLOAK_VERSION}}/kubernetes/keycloakrealmimports.k8s.keycloak.org-v1.yml
      - kubectl -n idp apply -f https://raw.githubusercontent.com/keycloak/keycloak-k8s-resources/{{.KEYCLOAK_VERSION}}/kubernetes/kubernetes.yml
      - kubectl apply --server-side -f {{.AUTH_EXAMPLE}}/keycloak/
      - echo "🔑 Keycloak deployed successfully!"

  configure-coredns:
    desc: 'Point keycloak.inference-gateway.local at the in-cluster Keycloak Service'
    cmds:
      - |
        kubectl apply -f - <<EOF
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: coredns-custom
          namespace: kube-system
        data:
          keycloak.override: |
            rewrite name keycloak.inference-gateway.local keycloak-service.idp.svc.cluster.local
        EOF
      - kubectl -n kube-system rollout restart deployment coredns
      - kubectl -n kube-system rollout status deployment coredns
      - echo "🧭 CoreDNS configured successfully!"

  deploy-inference-gateway:
    desc: 'Deploy the Inference Gateway (vanilla Deployment, no operator)'
    cmds:
      - kubectl create ns inference-gateway -o yaml --dry-run=client | kubectl apply --server-side -f -
      - |
        # Make Keycloak's self-signed CA available to the gateway (SSL_CERT_FILE).
        kubectl create configmap keycloak-ca \
          -n inference-gateway \
          --from-literal=ca.crt="$(kubectl get secret keycloak-tls -n idp -o jsonpath='{.data.ca\.crt}' | base64 -d)" \
          --dry-run=client -o yaml | kubectl apply --server-side -f -
      - kubectl apply -f gateway.yaml
      - kubectl -n inference-gateway rollout status deployment/inference-gateway
      - echo "🔒 Inference Gateway deployed successfully!"

  keycloak-admin-password:
    desc: 'Get the Keycloak admin password'
    cmds:
      - kubectl -n idp get secret keycloak-initial-admin -o jsonpath="{.data.password}" | base64 --decode
      - echo ""

  port-forward-keycloak:
    desc: 'Forward Keycloak to https://localhost:8543'
    cmds:
      - 'echo "Keycloak: https://localhost:8543 (Ctrl+C to stop)"'
      - kubectl -n idp port-forward svc/keycloak-service 8543:8543

  fetch-access-token:
    desc: 'Fetch an access token (requires `task port-forward-keycloak` running)'
    cmds:
      - |
        curl -k -s -X POST \
          --resolve keycloak.inference-gateway.local:8543:127.0.0.1 \
          -H "Content-Type: application/x-www-form-urlencoded" \
          "https://keycloak.inference-gateway.local:8543/realms/inference-gateway-realm/protocol/openid-connect/token" \
          -d "grant_type=password" \
          -d "client_id=inference-gateway-client" \
          -d "client_secret=very-secret" \
          -d "username=user" \
          -d "password=password" | jq -r .access_token

  print-access-token-payload:
    desc: 'Print the decoded access token payload'
    cmds:
      - |
        ACCESS_TOKEN=$(task fetch-access-token)
        echo $ACCESS_TOKEN | tr '.' '\n' | sed -n 2p | base64 -d | jq .

  fetch-models:
    desc: 'List all LLMs from the Inference-Gateway (via Envoy on localhost:80)'
    cmds:
      - |
        ACCESS_TOKEN=$(task fetch-access-token)
        curl -s -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "Host: api.inference-gateway.local" \
          http://localhost/v1/models | jq '.'

  generate-completions:
    desc: 'Generate completions using Ollama provider'
    cmds:
      - |
        ACCESS_TOKEN=$(task fetch-access-token)
        echo "Enter your prompt (type your text and press Enter):"
        read USER_PROMPT

        JSON_PAYLOAD=$(jq -n \
          --arg model "ollama/deepseek-r1:1.5b" \
          --arg system_content "You are a helpful assistant." \
          --arg user_content "$USER_PROMPT" \
          '{
            model: $model,
            messages: [
              { role: "system", content: $system_content },
              { role: "user", content: $user_content }
            ]
          }')

        curl -s -X POST \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $ACCESS_TOKEN" \
          -H "Host: api.inference-gateway.local" \
          http://localhost/v1/chat/completions \
          -d "$JSON_PAYLOAD" | jq '.'

  deploy-ollama:
    desc: 'Deploy Ollama with the deepseek-r1:1.5b model'
    cmds:
      - kubectl create namespace ollama --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f ../examples/kubernetes/monitoring/ollama/
      - kubectl -n ollama rollout status deployment ollama
      - echo "🤖 Ollama deployed successfully! Use it with model ollama/deepseek-r1:1.5b"

  clean:
    desc: 'Delete the local cluster'
    cmds:
      - ctlptl delete -f Cluster.yaml
      - echo "🧹 Cluster cleaned up successfully!"
