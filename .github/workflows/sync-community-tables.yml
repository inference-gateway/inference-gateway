---
name: Sync Community Tables

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@v3.3.0
        id: app-token
        with:
          client-id: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            inference-gateway

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Sync tables from models.dev
        run: |
          gh api repos/sst/models.dev/tarball > /tmp/models.dev.tar.gz
          go run cmd/generate/main.go -type ModelsDev -input /tmp/models.dev.tar.gz -output providers/modelsdev/models.json
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Open pull request if tables changed
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: chore/sync-community-tables
          add-paths: providers/modelsdev/models.json
          committer: '${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>'
          author: '${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>'
          commit-message: 'chore(modelsdev): sync the models.dev metadata table'
          title: 'chore(modelsdev): sync the models.dev metadata table'
          body: >-
            Automated weekly sync of `providers/modelsdev/models.json` (pricing,
            context windows, modalities, statuses, and release dates) from the
            [models.dev](https://github.com/sst/models.dev) dataset.
            Only pricing whose rates changed carries a new `updated_at`.
          delete-branch: true
