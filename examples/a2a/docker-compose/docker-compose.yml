---
services:
  inference-gateway:
    image: ghcr.io/inference-gateway/inference-gateway:latest
    ports:
      - '8080:8080'
      # Metrics under /metrics, served when the env below turns telemetry on.
      - '9464:9464'
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SERVER_HOST: 0.0.0.0
      A2A_ENABLED: ${A2A_ENABLED:-true}
      A2A_AGENTS: ${A2A_AGENTS:-mock=http://mock-agent:8080,mock-b=http://mock-agent-b:8080}
      # Opt in per environment, e.g. GUARDRAILS_ENABLED=true docker compose up:
      # the Rego policies from ./policies then guard POST /a2a, and the a2a_*
      # relay metrics are exported on the port mapped above.
      GUARDRAILS_ENABLED: ${GUARDRAILS_ENABLED:-false}
      GUARDRAILS_POLICY_DIR: /etc/inference-gateway/guardrails/policies
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
    volumes:
      - ./policies:/etc/inference-gateway/guardrails/policies:ro
    depends_on:
      - mock-agent
      - mock-agent-b
    networks:
      - a2a-network

  # Two A2A agents built on the ADK with a mock LLM: no API key needed. The
  # gateway fetches both cards at startup, merges them into its own and relays
  # each /a2a call to the one agent the request names.
  mock-agent:
    image: ghcr.io/inference-gateway/mock-agent:latest
    environment:
      A2A_SERVER_PORT: '8080'
    networks:
      - a2a-network

  mock-agent-b:
    image: ghcr.io/inference-gateway/mock-agent:latest
    environment:
      A2A_SERVER_PORT: '8080'
    networks:
      - a2a-network

networks:
  a2a-network:
    driver: bridge
