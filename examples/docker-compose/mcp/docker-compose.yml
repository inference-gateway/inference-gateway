---
services:
  inference-gateway:
    image: ghcr.io/inference-gateway/inference-gateway:latest
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_EXPOSE: ${MCP_EXPOSE:-true}
      MCP_SERVERS: ${MCP_SERVERS:-time=http://mcp-time-server:8081/mcp,search=http://mcp-search-server:8082/mcp,filesystem=http://mcp-filesystem-server:8083/mcp,pizza=http://mcp-pizza-server:8084/mcp}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      - mcp-time-server
      - mcp-search-server
      - mcp-filesystem-server
      - mcp-pizza-server
    networks:
      - mcp-network

  mcp-inspector:
    image: node:lts
    working_dir: /app
    command: >
      sh -c "npx -y @modelcontextprotocol/inspector"
    ports:
      - '6274:6274'
      - '6277:6277'
    environment:
      LOG_LEVEL: debug
      HOST: 0.0.0.0
      # One entry for the whole fleet: the gateway's own MCP server aggregates
      # every server in MCP_SERVERS behind MCP_EXPOSE.
      MCP_SERVER_URL: http://inference-gateway:8080/mcp
    networks:
      - mcp-network
    depends_on:
      - inference-gateway

  mcp-time-server:
    build:
      context: ./time-server
      dockerfile: Dockerfile
    networks:
      - mcp-network

  mcp-search-server:
    build:
      context: ./search-server
      dockerfile: Dockerfile
    networks:
      - mcp-network

  mcp-filesystem-server:
    build:
      context: ./filesystem-server
      dockerfile: Dockerfile
    volumes:
      - ./filesystem-data:/tmp/mcp-files
    networks:
      - mcp-network

  mcp-pizza-server:
    build:
      context: ./pizza-server
      dockerfile: Dockerfile
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
