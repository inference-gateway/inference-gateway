# A provider that only answers clients presenting a certificate signed by the
# example CA, so the gateway's CLIENT_TLS_CERT_PATH is actually exercised.
server {
    listen 443 ssl;
    server_name mock-provider;

    ssl_certificate /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;

    default_type application/json;

    location = /v1/models {
        return 200 '{"object":"list","data":[{"id":"mock","object":"model","owned_by":"mock"}]}';
    }

    location = /v1/chat/completions {
        return 200 '{"id":"mock","object":"chat.completion","created":0,"model":"mock","choices":[{"index":0,"message":{"role":"assistant","content":"hello from a provider behind mutual TLS"},"finish_reason":"stop"}],"usage":{"prompt_tokens":0,"completion_tokens":0,"total_tokens":0}}';
    }
}
