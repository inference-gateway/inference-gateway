---
# Rendered with envsubst from ../../docker-compose/auth-gcp/.env, see Taskfile.yaml.
apiVersion: core.inference-gateway.com/v1alpha1
kind: Gateway
metadata:
  name: inference-gateway
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/instance: inference-gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: inference-gateway
spec:
  environment: production
  image: 'ghcr.io/inference-gateway/inference-gateway:latest'
  server:
    host: '0.0.0.0'
    timeouts:
      read: '60s'
      write: '60s'
      idle: '300s'
  # Google's issuer is shared by every Google account. The operator maps
  # clientId to AUTH_OIDC_CLIENT_ID, which the gateway uses as the expected
  # token audience: the URL tokens are minted for. The guardrails policy below
  # then restricts callers to the allowed service account.
  auth:
    enabled: true
    provider: oidc
    oidc:
      issuerUrl: 'https://accounts.google.com'
      clientId: '${GATEWAY_AUDIENCE}'
  guardrails:
    enabled: true
    failMode: closed
    policyDir: /etc/inference-gateway/guardrails/policies
    policiesConfigMap: inference-gateway-guardrails-policies
  providers:
    - name: OpenAI
      enabled: true
      env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: inference-gateway-secrets
              key: OPENAI_API_KEY
  resources:
    requests:
      cpu: '100m'
      memory: '128Mi'
    limits:
      cpu: '1000m'
      memory: '512Mi'
  gatewayAPI:
    enabled: true
    gateway:
      gatewayClassName: envoy
    httpRoute:
      hostnames:
        - api.inference-gateway.local
---
apiVersion: v1
kind: Secret
metadata:
  name: inference-gateway-secrets
  namespace: inference-gateway
type: Opaque
stringData:
  OPENAI_API_KEY: ''
