---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-inspector
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: mcp-inspector
    app.kubernetes.io/part-of: inference-gateway-mcp
    app.kubernetes.io/component: inspector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-inspector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-inspector
        app.kubernetes.io/part-of: inference-gateway-mcp
        app.kubernetes.io/component: inspector
    spec:
      containers:
        - name: mcp-inspector
          image: node:lts
          workingDir: /app
          command:
            - sh
            - -c
            # One entry for the whole fleet: the gateway's own MCP server
            # aggregates every server in spec.mcp.servers. It speaks MCP
            # 2026-07-28 only, so the Inspector uses the modern protocol era
            # (it defaults to legacy).
            - |
              echo "Starting MCP Inspector..."
              npx -y @modelcontextprotocol/inspector --web --transport http \
                --server-url http://inference-gateway:8080/mcp --protocol-era modern
          ports:
            - containerPort: 6274
              name: inspector
            - containerPort: 6275
              name: sandbox
          env:
            - name: LOG_LEVEL
              value: 'debug'
            - name: HOST
              value: '0.0.0.0'
            # The Inspector refuses to listen on all interfaces without this,
            # and the Service needs it to reach the pod.
            - name: DANGEROUSLY_BIND_ALL_INTERFACES
              value: 'true'
          livenessProbe:
            httpGet:
              path: /
              port: 6274
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 6274
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'

---
apiVersion: v1
kind: Service
metadata:
  name: mcp-inspector
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: mcp-inspector
    app.kubernetes.io/part-of: inference-gateway-mcp
    app.kubernetes.io/component: inspector
spec:
  selector:
    app.kubernetes.io/name: mcp-inspector
  ports:
    - port: 6274
      targetPort: 6274
      name: inspector
    - port: 6275
      targetPort: 6275
      name: sandbox
