---
apiVersion: v1
kind: Namespace
metadata:
  name: inference-gateway
---
# A plain Deployment rather than a Gateway custom resource: the operator's
# spec.server.tls has no client CA field yet (inference-gateway/operator#310).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: inference-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-gateway
    spec:
      containers:
        - name: inference-gateway
          image: inference-gateway:mtls
          imagePullPolicy: Never
          ports:
            - containerPort: 8443
          env:
            - name: ENVIRONMENT
              value: development
            - name: SERVER_PORT
              value: '8443'
            - name: SERVER_TLS_CERT_PATH
              value: /certs/server.crt
            - name: SERVER_TLS_KEY_PATH
              value: /certs/server.key
            - name: SERVER_TLS_CLIENT_CA_PATH
              value: /certs/ca.crt
            - name: CLIENT_TLS_CA_PATH
              value: /certs/ca.crt
            - name: CLIENT_TLS_CERT_PATH
              value: /certs/client.crt
            - name: CLIENT_TLS_KEY_PATH
              value: /certs/client.key
            - name: OPENAI_API_URL
              value: https://mock-provider/v1
            - name: OPENAI_API_KEY
              value: mock
          # A readiness probe would need a client certificate, which kubelet
          # cannot present, so the port being open is as far as it goes.
          readinessProbe:
            tcpSocket:
              port: 8443
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      # cert-manager writes tls.crt/tls.key/ca.crt into each Secret, projected
      # here under the file names the example and its nginx config use.
      volumes:
        - name: certs
          projected:
            sources:
              - secret:
                  name: gateway-server-tls
                  items:
                    - key: ca.crt
                      path: ca.crt
                    - key: tls.crt
                      path: server.crt
                    - key: tls.key
                      path: server.key
              - secret:
                  name: gateway-client-tls
                  items:
                    - key: tls.crt
                      path: client.crt
                    - key: tls.key
                      path: client.key
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  namespace: inference-gateway
spec:
  selector:
    app.kubernetes.io/name: inference-gateway
  ports:
    - port: 8443
      targetPort: 8443
---
# A client with the certificates mounted, so `task test` can call the gateway
# the way a workload in the cluster would.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.18.0
          command: ['sleep', 'infinity']
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          projected:
            sources:
              - secret:
                  name: gateway-client-tls
                  items:
                    - key: ca.crt
                      path: ca.crt
                    - key: tls.crt
                      path: client.crt
                    - key: tls.key
                      path: client.key
---
# Stands in for a provider that only answers clients presenting a certificate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-provider
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: mock-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-provider
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 443
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: mock-provider-conf
        - name: certs
          projected:
            sources:
              - secret:
                  name: mock-provider-tls
                  items:
                    - key: ca.crt
                      path: ca.crt
                    - key: tls.crt
                      path: server.crt
                    - key: tls.key
                      path: server.key
---
apiVersion: v1
kind: Service
metadata:
  name: mock-provider
  namespace: inference-gateway
spec:
  selector:
    app.kubernetes.io/name: mock-provider
  ports:
    - port: 443
      targetPort: 443
