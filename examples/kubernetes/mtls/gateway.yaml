---
apiVersion: v1
kind: Namespace
metadata:
  name: inference-gateway
  labels:
    inference-gateway.com/managed: 'true'
---
apiVersion: core.inference-gateway.com/v1alpha1
kind: Gateway
metadata:
  name: inference-gateway
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/instance: inference-gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: inference-gateway
spec:
  environment: development
  # Mutual TLS is newer than the published image, so the example builds it.
  image: 'inference-gateway:mtls'
  server:
    host: '0.0.0.0'
    port: 8443
    tls:
      enabled: true
      certificateRef:
        name: gateway-server-tls
        key: tls.crt
      keyRef:
        name: gateway-server-tls
        key: tls.key
      # Requires a client certificate signed by the example CA. The operator
      # also switches the probes to tcpSocket, since kubelet has no certificate.
      clientCARef:
        name: gateway-server-tls
        key: ca.crt
  client:
    tls:
      caRef:
        name: gateway-client-tls
        key: ca.crt
      certificateRef:
        name: gateway-client-tls
        key: tls.crt
      keyRef:
        name: gateway-client-tls
        key: tls.key
  providers:
    - name: OpenAI
      enabled: true
      env:
        - name: OPENAI_API_URL
          value: https://mock-provider/v1
        - name: OPENAI_API_KEY
          value: mock
---
# A client with the certificates mounted, so `task test` can call the gateway
# the way a workload in the cluster would.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: client
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.18.0
          command: ['sleep', 'infinity']
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          projected:
            sources:
              - secret:
                  name: gateway-client-tls
                  items:
                    - key: ca.crt
                      path: ca.crt
                    - key: tls.crt
                      path: client.crt
                    - key: tls.key
                      path: client.key
---
# Stands in for a provider that only answers clients presenting a certificate.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-provider
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: mock-provider
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-provider
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 443
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: conf
          configMap:
            name: mock-provider-conf
        - name: certs
          projected:
            sources:
              - secret:
                  name: mock-provider-tls
                  items:
                    - key: ca.crt
                      path: ca.crt
                    - key: tls.crt
                      path: server.crt
                    - key: tls.key
                      path: server.key
---
apiVersion: v1
kind: Service
metadata:
  name: mock-provider
  namespace: inference-gateway
spec:
  selector:
    app.kubernetes.io/name: mock-provider
  ports:
    - port: 443
      targetPort: 443
