version: '3'

# The provider's nginx config is shared with the docker-compose example of the
# same name. The certificates come from cert-manager.
vars:
  EXAMPLE: ../../docker-compose/mtls
  CERT_MANAGER_VERSION: v1.20.2
  # The first operator release that can express mutual TLS in both directions.
  OPERATOR_VERSION: v0.31.0
  CLUSTER: mtls
  IMAGE: inference-gateway:mtls
  NAMESPACE: inference-gateway
  GATEWAY: https://inference-gateway:8443
  CURL: kubectl -n inference-gateway exec deployment/client -- curl
  MTLS: --cacert /certs/ca.crt --cert /certs/client.crt --key /certs/client.key
  BODY: '{"model":"openai/mock","messages":[{"role":"user","content":"hi"}]}'

tasks:
  default:
    desc: 'Show available tasks'
    cmds:
      - task --list

  deploy-infrastructure:
    desc: 'Create the cluster, install cert-manager and the operator, load the gateway image'
    cmds:
      - task: create-cluster
      - task: deploy-cert-manager
      - task: deploy-inference-gateway-operator
      - task: load-image
      - echo "🛠️ Infrastructure deployed successfully!"

  create-cluster:
    desc: 'Create a Kubernetes cluster using ctlptl'
    cmds:
      - ctlptl apply -f Cluster.yaml

  load-image:
    desc: 'Build the gateway from this checkout and import it into the cluster'
    cmds:
      # Mutual TLS is newer than the published image, so the example builds it.
      - docker build -t {{.IMAGE}} ../../..
      - k3d image import {{.IMAGE}} -c {{.CLUSTER}}

  deploy-cert-manager:
    desc: 'Install cert-manager'
    cmds:
      - helm repo add jetstack https://charts.jetstack.io
      - helm repo update
      - |
        helm upgrade --install cert-manager jetstack/cert-manager \
          --create-namespace \
          --namespace cert-manager \
          --version {{.CERT_MANAGER_VERSION}} \
          --set crds.enabled=true \
          --wait
      - echo "🔐 Cert-manager deployed successfully!"

  deploy-inference-gateway-operator:
    desc: 'Deploy the Inference Gateway operator'
    cmds:
      - kubectl apply -f https://github.com/inference-gateway/operator/releases/download/{{.OPERATOR_VERSION}}/install.yaml
      - kubectl -n inference-gateway-system wait --for=condition=Available --timeout=120s deployment/operator-inference-gateway
      - echo "🛠️ Inference Gateway operator deployed successfully!"

  certs:
    desc: 'Have cert-manager issue the example CA, server and client certificates'
    cmds:
      - kubectl create namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f cert-manager/issuers.yaml
      - kubectl -n {{.NAMESPACE}} wait --for=condition=Ready --timeout=120s certificate/example-ca
      - kubectl apply -f cert-manager/certificates.yaml
      - |
        kubectl -n {{.NAMESPACE}} wait --for=condition=Ready --timeout=120s \
          certificate/gateway-server certificate/gateway-client certificate/mock-provider-server

  deploy-inference-gateway:
    desc: 'Deploy the gateway and the provider behind mutual TLS'
    deps: [certs]
    cmds:
      - |
        kubectl -n {{.NAMESPACE}} create configmap mock-provider-conf \
          --from-file=default.conf={{.EXAMPLE}}/nginx.conf \
          --dry-run=client -o yaml | kubectl apply -f -
      - kubectl apply -f gateway.yaml
      # Every pod reads the certificates once at startup, so a reissued set only
      # takes effect on a new pod.
      - kubectl -n {{.NAMESPACE}} rollout restart deployment/mock-provider deployment/client
      - kubectl -n {{.NAMESPACE}} rollout status deployment/mock-provider --timeout=180s
      - kubectl -n {{.NAMESPACE}} rollout status deployment/client --timeout=180s
      # The gateway Deployment is the operator's, so wait for it to appear first.
      - kubectl -n {{.NAMESPACE}} wait --for=create --timeout=120s deployment/inference-gateway
      - kubectl -n {{.NAMESPACE}} rollout status deployment/inference-gateway --timeout=180s
      - echo "🔐 Inference Gateway with mutual TLS deployed successfully!"

  test:
    desc: 'Run every case from the client pod'
    silent: true
    cmds:
      - |
        printf '\n=== with a client certificate (expected 200 and the provider reply)\n'
        {{.CURL}} -sS -w '\n[HTTP %{http_code}]\n' {{.MTLS}} {{.GATEWAY}}/v1/chat/completions \
          -H 'Content-Type: application/json' -d '{{.BODY}}'

        printf '\n=== without a client certificate (expected a TLS handshake failure)\n'
        if {{.CURL}} -sS --cacert /certs/ca.crt {{.GATEWAY}}/v1/chat/completions \
          -H 'Content-Type: application/json' -d '{{.BODY}}'; then
          echo '[unexpectedly accepted]'
          exit 1
        fi
        echo '[rejected]'

        printf '\n=== models (expected 200 and the mock model)\n'
        {{.CURL}} -sS -w '\n[HTTP %{http_code}]\n' {{.MTLS}} {{.GATEWAY}}/v1/models

  clean:
    desc: 'Clean up the cluster'
    cmds:
      - ctlptl delete -f Cluster.yaml
      - echo "🧹 Cluster cleaned up successfully!"
