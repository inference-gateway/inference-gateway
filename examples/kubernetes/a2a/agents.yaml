---
# An A2A agent built on the ADK with a mock LLM: no API key needed. The label is
# what the Gateway's spec.a2a.serviceDiscovery selector matches.
apiVersion: core.inference-gateway.com/v1alpha1
kind: Agent
metadata:
  name: mock-agent
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: mock-agent
    app.kubernetes.io/part-of: inference-gateway
    a2a: demo
spec:
  image: 'ghcr.io/inference-gateway/mock-agent:latest'
  port: 8080
  env:
    - name: A2A_SERVER_PORT
      value: '8080'
  resources:
    requests:
      cpu: '50m'
      memory: '64Mi'
    limits:
      cpu: '500m'
      memory: '256Mi'
