---
version: '3'

vars:
  CERT_MANAGER_VERSION: v1.20.2
  # Envoy Gateway's chart installs the Gateway API CRDs it supports (v1.6).
  ENVOY_GATEWAY_VERSION: v1.9.1
  OPERATOR_VERSION: v0.25.1

tasks:
  deploy-infrastructure:
    desc: 'Deploy TLS infrastructure'
    cmds:
      - task: create-cluster
      # Envoy Gateway first: it brings the Gateway API CRDs cert-manager watches.
      - task: deploy-envoy-gateway
      - task: deploy-cert-manager
      - task: deploy-inference-gateway-operator
      - echo "🔒 TLS infrastructure deployed successfully!"

  create-cluster:
    desc: 'Create a Kubernetes cluster using ctlptl'
    cmds:
      - ctlptl apply -f Cluster.yaml
      - echo "🛠️ Cluster created successfully!"

  deploy-cert-manager:
    desc: 'Deploy cert-manager and a self-signed ClusterIssuer'
    cmds:
      - helm repo add jetstack https://charts.jetstack.io
      - helm repo update
      - |
        helm upgrade --install cert-manager jetstack/cert-manager \
          --create-namespace \
          --namespace cert-manager \
          --version {{.CERT_MANAGER_VERSION}} \
          --set crds.enabled=true \
          --set config.apiVersion=controller.config.cert-manager.io/v1alpha1 \
          --set config.kind=ControllerConfiguration \
          --set config.enableGatewayAPI=true \
          --wait
      - kubectl apply -f cert-manager/
      - echo "🔐 Cert-manager deployed successfully!"

  deploy-envoy-gateway:
    desc: 'Deploy Envoy Gateway (with its Gateway API CRDs) and register the envoy GatewayClass'
    cmds:
      - |
        helm upgrade --install envoy-gateway \
          oci://docker.io/envoyproxy/gateway-helm \
          --version {{.ENVOY_GATEWAY_VERSION}} \
          --namespace envoy-gateway-system \
          --create-namespace \
          --wait
      - kubectl -n envoy-gateway-system wait --for=condition=Available --timeout=120s deployment/envoy-gateway
      - |
        kubectl apply -f - <<'EOF'
        apiVersion: gateway.networking.k8s.io/v1
        kind: GatewayClass
        metadata:
          name: envoy
        spec:
          controllerName: gateway.envoyproxy.io/gatewayclass-controller
        EOF
      - echo "🚪 Envoy Gateway deployed successfully!"

  deploy-inference-gateway-operator:
    desc: 'Deploy the Inference Gateway operator'
    cmds:
      - kubectl apply -f https://github.com/inference-gateway/operator/releases/download/{{.OPERATOR_VERSION}}/install.yaml
      - kubectl -n inference-gateway-system wait --for=condition=Available --timeout=120s deployment/operator-inference-gateway
      - echo "🛠️ Inference Gateway operator deployed successfully!"

  deploy-inference-gateway:
    desc: 'Deploy the Inference Gateway with TLS via the operator'
    cmds:
      - kubectl apply -f gateway.yaml
      - echo "🔐 Inference Gateway with TLS deployed successfully!"

  clean:
    desc: 'Clean up the cluster'
    cmds:
      - ctlptl delete -f Cluster.yaml
      - echo "🧹 Cluster cleaned up successfully!"
