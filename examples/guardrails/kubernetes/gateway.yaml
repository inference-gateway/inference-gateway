---
apiVersion: v1
kind: Namespace
metadata:
  name: inference-gateway
  labels:
    inference-gateway.com/managed: 'true'
---
# Rego policies are shipped as a ConfigMap, referenced by
# spec.guardrails.configMapRef and mounted into the gateway's policy directory.
# Every .rego file must be in
# package guardrails and expose a main rule returning one of the four actions
# allow, block ("action": "block", "message": "..."), redact or warn.
apiVersion: v1
kind: ConfigMap
metadata:
  name: inference-gateway-guardrails-policies
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/instance: inference-gateway
    app.kubernetes.io/component: guardrails-policies
    app.kubernetes.io/part-of: inference-gateway
data:
  allow_all.rego: |
    package guardrails

    # Default allow-all policy.
    # Override with more specific rules in additional .rego files.
    default main := {"action": "allow"}
  block_pii.rego: |
    package guardrails

    # Block requests containing credit card numbers in the body.
    # This is a simple example - in production, use the built-in detectors
    # which include Luhn validation.
    main := {"action": "block", "message": "request contains sensitive payment information"} if {
        contains(input.request.body, "4111")
    }
  redact_secrets.rego: |
    package guardrails

    # Redact instead of refuse: returning {"action": "redact"} makes the
    # middleware run its built-in detectors over the payload. API keys,
    # bearer tokens and credit cards are replaced with [REDACTED]; emails
    # are detected but not redacted. The call continues either way - the
    # provider receives a redacted request body on pre_call, the client a
    # redacted response body on post_call.
    #
    # A conditional `main` body must stay mutually exclusive with the
    # other policies' bodies (see authz.rego): a body that matched every
    # request would override the allow_all default and collide with the
    # others, an OPA conflict that blocks under
    # GUARDRAILS_FAIL_MODE=closed. So it only fires on bodies holding a
    # secret-shaped value, copying the redactable patterns of
    # DefaultDetectors in internal/guardrails/guardrails.go - the
    # middleware owns the real detection.
    main := {"action": "redact"} if {
        input.phase in {"pre_call", "post_call"}
        secrets_in_body
    }

    # api_key / token / secret assignments, e.g. "api_key: sk-1234567890abcdef"
    secrets_in_body if {
        regex.match(`(?i)(?:api[_-]?key|apikey|token|secret)\s*[:=]\s*['"]?\S{8,}`, input.request.body)
    }

    # bearer tokens, e.g. "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9"
    secrets_in_body if {
        regex.match(`(?i)bearer\s+[A-Za-z0-9\-._~+/]{20,}`, input.request.body)
    }
---
apiVersion: core.inference-gateway.com/v1alpha1
kind: Gateway
metadata:
  name: inference-gateway
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/instance: inference-gateway
    app.kubernetes.io/component: api-gateway
    app.kubernetes.io/part-of: inference-gateway
spec:
  environment: production
  image: 'ghcr.io/inference-gateway/inference-gateway:latest'
  server:
    host: '0.0.0.0'
    timeouts:
      read: '60s'
      write: '60s'
      idle: '300s'
  guardrails:
    enabled: true
    failMode: deny
    configMapRef:
      name: inference-gateway-guardrails-policies
  providers:
    - name: OpenAI
      enabled: true
      env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: inference-gateway-secrets
              key: OPENAI_API_KEY
  resources:
    requests:
      cpu: '100m'
      memory: '128Mi'
    limits:
      cpu: '1000m'
      memory: '512Mi'
  gatewayAPI:
    enabled: true
    gateway:
      gatewayClassName: envoy
    httpRoute:
      hostnames:
        - api.inference-gateway.local
---
apiVersion: v1
kind: Secret
metadata:
  name: inference-gateway-secrets
  namespace: inference-gateway
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/instance: inference-gateway
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: inference-gateway
type: Opaque
stringData:
  OPENAI_API_KEY: ''
